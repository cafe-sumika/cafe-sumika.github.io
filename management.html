<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- 検索インデックスしない -->
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <title>管理ダッシュボード</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            padding: 10px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f0f0f0;
        }

        .category-title {
            font-size: 1rem;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        @media (max-width: 576px) {
            .d-flex.gap-2 {
                flex-direction: column;
            }

            .d-flex.gap-2 input,
            .d-flex.gap-2 textarea {
                width: 100%;
            }

            .nav-tabs .nav-link {
                font-size: 0.9rem;
                padding: 6px;
            }
        }

        /* サムネイル画像 */
        img {
            width: 80px;
            /* 40 → 80px */
            height: 80px;
            /* 40 → 80px */
            object-fit: cover;
            cursor: pointer;
            margin:5px;
        }

        /* 説明欄 */
        td textarea {
            width: 300px;
            /* 横幅広め */
            height: 80px;
            /* 高さも少し広く */
        }

        /* 表示順 */
        td input[type="number"] {
            width: 60px;
            /* 狭め */
        }

        .description-field {
            width: 100%;
            height: 100px;
        }

        .order-field {
            width: 60px;
        }
    </style>
</head>

<body>
    <div class="container my-4">
        <h1 class="text-center mb-4">管理ダッシュボード</h1>

        <!-- ログインフォーム -->
        <div id="login-section" class="text-center">
            <input type="email" id="login-email" class="form-control mb-2" placeholder="メールアドレス">
            <input type="password" id="login-password" class="form-control mb-2" placeholder="パスワード">
            <button id="login-btn" class="btn btn-primary mb-2">ログイン</button>
            <div id="login-error" class="text-danger"></div>
        </div>

        <!-- ダッシュボード -->
        <div id="dashboard" style="display:none;">
            <ul class="nav nav-tabs mb-3" id="dashboard-tabs">
                <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#menu-tab">メニュー管理</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#opening-tab">営業日管理</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#notice-tab">お知らせ管理</a></li>
            </ul>
            <div class="tab-content">

                <!-- メニュー管理 -->
                <div class="tab-pane fade show active" id="menu-tab">
                    <div id="menu-tables"></div>
                </div>

                <!-- 営業日管理 -->
                <div class="tab-pane fade" id="opening-tab">
                    <div class="border p-3 mb-3">
                        <h5>新規営業日追加</h5>
                        <div class="d-flex gap-2 mb-2">
                            <input type="date" id="new-opening-date" class="form-control">
                            <input type="time" id="new-opening-start" class="form-control" value="11:00">
                            <input type="time" id="new-opening-end" class="form-control" value="16:00">
                        </div>
                        <button class="btn btn-success" id="add-opening-btn">追加</button>
                    </div>
                    <div id="opening-list" class="mb-3"></div>
                </div>

                <!-- お知らせ管理 -->
                <div class="tab-pane fade" id="notice-tab">
                    <div class="border p-3 mb-3">
                        <h5>新規お知らせ追加</h5>
                        <textarea id="new-notice-message" class="form-control mb-2" style="width:100%;"
                            placeholder="内容"></textarea>
                        <button class="btn btn-success" id="add-notice-btn">追加</button>
                    </div>
                    <div id="notice-list" class="mb-3"></div>
                </div>

            </div>
            <button class="btn btn-secondary mt-3" id="logout-btn">ログアウト</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://cvsmppnkdrizgatuayke.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2c21wcG5rZHJpemdhdHVheWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY3MDMzNjYsImV4cCI6MjA3MjI3OTM2Nn0.f749GIM3SNZ4mGgtvJyvAiBQXjYtiiXomon6g7bjiP8';

        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const BUCKET = 'images';
        const CATEGORIES = ["Menu", "コーヒー", "カフェラテ", "ホットティー", "アイスティー", "キッズドリンク", "その他"];

        const loginSection = document.getElementById('login-section');
        const dashboard = document.getElementById('dashboard');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');

        loginBtn.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) return loginError.textContent = error.message;
            loginSection.style.display = 'none';
            dashboard.style.display = 'block';
            fetchMenuItems();
            fetchOpenings();
            fetchNotices();
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            supabaseClient.auth.signOut().then(() => {
                dashboard.style.display = 'none';
                loginSection.style.display = 'block';
            });
        });

        // ----------------------------
        // メニュー管理
        // ----------------------------
        async function fetchMenuItems() {
            const { data, error } = await supabaseClient.from('menu_items').select('*').order('category', { ascending: true }).order('order', { ascending: true });
            if (error) return alert('読み込みエラー: ' + error.message);
            renderTables(data || []);
        }

        function renderTables(items) {
            const container = document.getElementById('menu-tables');
            container.innerHTML = '';
            CATEGORIES.forEach(category => {
                const title = document.createElement('div');
                title.textContent = category;
                title.className = 'category-title';
                container.appendChild(title);

                const table = document.createElement('table');
                table.dataset.category = category;
                table.innerHTML = `<thead><tr><th>画像</th><th>名前</th><th>説明</th><th>表示順</th><th>操作</th></tr></thead><tbody></tbody>`;
                container.appendChild(table);
                const tbody = table.querySelector('tbody');

                items.filter(i => i.category === category).forEach(item => tbody.appendChild(createRow(item)));

const addBtn = document.createElement('button');
addBtn.textContent = '＋ 新規追加';
addBtn.className = 'btn btn-sm btn-success my-2';
addBtn.addEventListener('click', () => {
    // 既存アイテムの最大 order を計算
    const orders = items.filter(i => i.category === category).map(i => i.order || 0);
    const maxOrder = orders.length > 0 ? Math.max(...orders) : 0;

    // 最大 order + 1 をデフォルトにする
    const newItem = {
        id: null,
        name: '',
        description: '',
        category,
        order: maxOrder + 1,
        image: null
    };
    tbody.appendChild(createRow(newItem));
});
container.appendChild(addBtn);

            });
        }

        function createRow(item) {
            const tr = document.createElement('tr');
            tr.dataset.id = item.id || '';
            const name = item.name || '';
            const description = item.description || '';
            const order = item.order || 0;
            let imageCellHtml = item.image ? `<div><img src="${item.image}" alt="pic" onerror="this.onerror=null;this.src='images/sample.png';"><br><button class="btn btn-sm btn-outline-danger img-del-btn">画像削除</button></div>` : `<span class="no-image">画像なし</span>`;
            tr.innerHTML = `
                <td>${imageCellHtml}</td>
                <td><input type="text" value="${name}" class="form-control"></td>
                <td><textarea rows="3" class="form-control description-field">${description}</textarea></td>
                <td><input type="number" value="${order}" class="form-control order-field"></td>
                <td>
                <button class="btn btn-sm btn-primary save-btn">保存</button>
                ${item.id ? '<button class="btn btn-sm btn-danger delete-btn">削除</button>' : ''}
                </td>
             `;
            // イベント登録は addEventListener
            const imgEl = tr.querySelector('img');
            const spanEl = tr.querySelector('span.no-image');
            if (imgEl) imgEl.addEventListener('click', () => handleImageUpload(tr, item));
            else if (spanEl) spanEl.addEventListener('click', () => handleImageUpload(tr, item));

            const delImgBtn = tr.querySelector('.img-del-btn');
            if (delImgBtn) delImgBtn.addEventListener('click', () => handleImageDelete(tr, item));

            tr.querySelector('.save-btn').addEventListener('click', async () => {
                const inputs = tr.querySelectorAll('input, textarea');
                const payload = { name: inputs[0].value, description: inputs[1].value, order: parseInt(inputs[2].value, 10), category: tr.closest('table').dataset.category };
                if (item.id) {
                    const { error } = await supabaseClient.from('menu_items').update(payload).eq('id', item.id);
                    if (error) return alert('更新エラー: ' + error.message);
                } else {
                    const { data, error } = await supabaseClient.from('menu_items').insert([payload]).select();
                    if (error) return alert('追加エラー: ' + error.message);
                    item.id = data[0].id;
                }
                alert('保存完了');
                fetchMenuItems();
            });

            const delBtn = tr.querySelector('.delete-btn');
            if (delBtn) delBtn.addEventListener('click', async () => {
                if (!confirm('削除しますか？')) return;
                const { error } = await supabaseClient.from('menu_items').delete().eq('id', item.id);
                if (error) return alert('削除エラー: ' + error.message);
                tr.remove();
                alert('削除完了');
            });
            return tr;
        }
        // ----------------------------
        // 画像アップロード（認証ユーザーのみ）
        // ----------------------------
        async function handleImageUpload(tr, item) {
            if (!item.id) return alert('画像アップロードは保存済みメニューでのみ可能です。');

            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async () => {
                const file = input.files[0];
                const path = `private/${file.name}`;

                // 認証ユーザーのみアップロード可能（privateバケット + RLS）
                const { error: uploadError } = await supabaseClient.storage.from(BUCKET).upload(path, file, { upsert: true });
                if (uploadError) return alert('アップロード失敗: ' + uploadError.message);

                // 署名付き URL を長期生成（閲覧は誰でもOK）
                const { data: urlData, error: urlError } = await supabaseClient.storage.from(BUCKET).createSignedUrl(path, 60 * 60 * 24 * 36500);
                if (urlError) return alert('URL取得失敗: ' + urlError.message);

                // DB 更新
                const { error: updErr } = await supabaseClient.from('menu_items').update({ image: urlData.signedUrl }).eq('id', item.id);
                if (updErr) return alert('DB更新失敗: ' + updErr.message);

                // 画面更新
                const imgCell = tr.querySelector('td:first-child');
                imgCell.innerHTML = `<img src="${urlData.signedUrl}" alt="pic">`;
                imgCell.querySelector('img').addEventListener('click', () => handleImageUpload(tr, item));
                item.image = urlData.signedUrl;
                alert('画像アップロード完了');
                fetchMenuItems();
            };
            input.click();
        }
        // ----------------------------
        // 画像削除（認証ユーザーのみ）
        // ----------------------------
        async function handleImageDelete(tr, item) {
            if (!item.id || !item.image) return alert('削除対象の画像がありません');

            if (!confirm('画像を削除しますか？')) return;

            // 署名付きURLからパスを抽出（例: private/xxx.jpg）
            const url = new URL(item.image);
            const pathname = url.pathname;
            // /storage/v1/object/sign/images/private/xxx.jpg?...
            const path = decodeURIComponent(pathname.split("/object/sign/" + BUCKET + "/")[1]);

            // ストレージから削除
            const { error: delErr } = await supabaseClient.storage.from(BUCKET).remove([path]);
            if (delErr) return alert('ストレージ削除失敗: ' + delErr.message);

            // DBを更新（image=null）
            const { error: updErr } = await supabaseClient.from('menu_items').update({ image: null }).eq('id', item.id);
            if (updErr) return alert('DB更新失敗: ' + updErr.message);

            // UI更新
            const imgCell = tr.querySelector('td:first-child');
            imgCell.innerHTML = `<span class="no-image">画像なし</span>`;
            imgCell.querySelector('span.no-image').addEventListener('click', () => handleImageUpload(tr, item));

            item.image = null;
            alert('画像削除完了');
        }
        // ----------------------------
        // 営業日管理・お知らせ管理
        // ----------------------------
        document.getElementById('add-opening-btn').addEventListener('click', async () => {
            const date = document.getElementById('new-opening-date').value;
            const start_time = document.getElementById('new-opening-start').value;
            const end_time = document.getElementById('new-opening-end').value;
            if (!date || !start_time || !end_time) return alert('全て入力してください');
            await supabaseClient.from('opening_days').insert([{ date, start_time, end_time }]);
            document.getElementById('new-opening-date').value = '';
            document.getElementById('new-opening-start').value = '11:00';
            document.getElementById('new-opening-end').value = '16:00';
            fetchOpenings();
            alert('追加完了');
        });

        async function fetchOpenings() {
            const { data } = await supabaseClient.from('opening_days').select('*').order('date', { ascending: true });
            const container = document.getElementById('opening-list');
            container.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'border p-2 mb-2 d-flex justify-content-between align-items-center';
                const inputWrapper = document.createElement('div');
                inputWrapper.className = 'd-flex gap-2';

                const dateInput = document.createElement('input');
                dateInput.type = 'date'; dateInput.value = item.date;
                dateInput.className = 'form-control'; dateInput.id = `opening-date-${item.id}`;

                const startInput = document.createElement('input');
                startInput.type = 'time'; startInput.value = item.start_time;
                startInput.className = 'form-control'; startInput.id = `opening-start-${item.id}`;

                const endInput = document.createElement('input');
                endInput.type = 'time'; endInput.value = item.end_time;
                endInput.className = 'form-control'; endInput.id = `opening-end-${item.id}`;

                inputWrapper.appendChild(dateInput);
                inputWrapper.appendChild(startInput);
                inputWrapper.appendChild(endInput);

                const btnWrapper = document.createElement('div');
                const updateBtn = document.createElement('button');
                updateBtn.className = 'btn btn-sm btn-primary me-1'; updateBtn.textContent = '更新';
                updateBtn.addEventListener('click', () => updateOpening(item.id));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-sm btn-danger'; deleteBtn.textContent = '削除';
                deleteBtn.addEventListener('click', () => deleteOpening(item.id));

                btnWrapper.appendChild(updateBtn); btnWrapper.appendChild(deleteBtn);
                div.appendChild(inputWrapper); div.appendChild(btnWrapper);
                container.appendChild(div);
            });
        }

        async function updateOpening(id) {
            const date = document.getElementById(`opening-date-${id}`).value;
            const start_time = document.getElementById(`opening-start-${id}`).value;
            const end_time = document.getElementById(`opening-end-${id}`).value;
            await supabaseClient.from('opening_days').update({ date, start_time, end_time }).eq('id', id);
            fetchOpenings();
            alert('更新完了');
        }

        async function deleteOpening(id) {
            if (!confirm('削除しますか？')) return;
            await supabaseClient.from('opening_days').delete().eq('id', id);
            fetchOpenings();
            alert('削除完了');
        }

        // ----------------------------
        // お知らせ管理
        // ----------------------------
        //お知らせ新規追加
        document.getElementById('add-notice-btn').addEventListener('click', async () => {
            const message = document.getElementById('new-notice-message').value;
            if (!message) return alert('内容を入力してください');
            const today = new Date().toISOString().split('T')[0];
            await supabaseClient.from('notices').insert([{ date: today, message }]);
            document.getElementById('new-notice-message').value = '';
            fetchNotices();
            alert('送信完了');
        });

        async function fetchNotices() {
            const { data } = await supabaseClient.from('notices').select('*').order('date', { ascending: false });
            const container = document.getElementById('notice-list');
            container.innerHTML = '';
            data.forEach(item => {
                const div = document.createElement('div'); div.className = 'border p-2 mb-2';
                const inputWrapper = document.createElement('div'); inputWrapper.className = 'mb-2';

                const dateInput = document.createElement('input'); dateInput.type = 'date'; dateInput.value = item.date;
                dateInput.className = 'form-control mb-1'; dateInput.id = `notice-date-${item.id}`;

                const messageInput = document.createElement('textarea');
                messageInput.className = 'form-control mb-1'; messageInput.style.width = '100%'; messageInput.style.minHeight = '100px';
                messageInput.id = `notice-message-${item.id}`; messageInput.value = item.message;

                inputWrapper.appendChild(dateInput); inputWrapper.appendChild(messageInput);

                const btnWrapper = document.createElement('div');
                const updateBtn = document.createElement('button'); updateBtn.className = 'btn btn-sm btn-primary me-1';
                updateBtn.textContent = '更新'; updateBtn.addEventListener('click', () => updateNotice(item.id));

                const deleteBtn = document.createElement('button'); deleteBtn.className = 'btn btn-sm btn-danger';
                deleteBtn.textContent = '削除'; deleteBtn.addEventListener('click', () => deleteNotice(item.id));

                btnWrapper.appendChild(updateBtn); btnWrapper.appendChild(deleteBtn);
                div.appendChild(inputWrapper); div.appendChild(btnWrapper);
                container.appendChild(div);
            });
        }

        async function updateNotice(id) {
            const date = document.getElementById(`notice-date-${id}`).value;
            const message = document.getElementById(`notice-message-${id}`).value;
            await supabaseClient.from('notices').update({ date, message }).eq('id', id);
            fetchNotices();
            alert('更新完了');
        }

        async function deleteNotice(id) {
            if (!confirm('削除しますか？')) return;
            await supabaseClient.from('notices').delete().eq('id', id);
            fetchNotices();
            alert('削除完了');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
